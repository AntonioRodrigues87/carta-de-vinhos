<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta de Vinhos</title>
<meta property="og:title" content="Carta de Vinhos">
<meta property="og:description" content="Escolha seus vinhos e envie o pedido pelo WhatsApp.">
<meta name="description" content="Escolha seus vinhos e envie o pedido pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('carta_tema')==='escuro')document.documentElement.dataset.tema='escuro'}catch(e){}</script>
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2a1d1b;--muted:#7d6c66;--line:#e9dfd3;--wine:#6e1a2f;--wine2:#8f2b44;--soft:#f2e3e5;--gold:#a8812f;--goldSoft:#f6ecd6;--ok:#2f7a4b;--wt:#6e1a2f;--ds:#4b3b37;--ph1:#f3ebe2;--ph2:#ece0d3;--ult:#b3261e;--toastBg:#2a1d1b;--toastFg:#fff;}
html[data-tema=escuro]{color-scheme:dark;--bg:#16100f;--card:#211816;--ink:#f3e9e4;--muted:#b3a29c;--line:#3a2c29;--wine:#8f2b44;--wine2:#a8354f;--soft:#3a2026;--gold:#e0b75a;--goldSoft:#3a2f18;--wt:#e9a6b6;--ds:#d9cbc5;--ph1:#efe6dc;--ph2:#e2d5c7;--ult:#ff8a80;--toastBg:#f3e9e4;--toastFg:#16100f;}
.tema{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fbeee9;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px)}
.hero{position:relative}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.hero{background:radial-gradient(120% 140% at 0% 0%,#8f2b44 0%,#5a1426 55%,#3a0d19 100%);color:#fbeee9;padding:calc(env(safe-area-inset-top) + 34px) 22px 30px}
.hero .in{max-width:980px;margin:0 auto}
.hero small{letter-spacing:.18em;text-transform:uppercase;font-size:11.5px;opacity:.75}
.hero h1{font-family:Fraunces,serif;font-weight:600;font-size:34px;line-height:1.1;margin:8px 0 8px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85;max-width:560px}
.wrap{max-width:980px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom))}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;margin-bottom:4px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.search{color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);margin:6px 2px 10px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.bod{grid-column:1/-1;margin:18px 2px 0;font-size:17px;font-weight:700;color:var(--wt);display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}.bod:first-child{margin-top:4px}.bod small{font-size:12px;font-weight:500;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.w{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;box-shadow:0 1px 2px rgba(60,30,20,.05)}
.ph{width:92px;flex:none;height:150px;border-radius:12px;background:linear-gradient(180deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ph svg{height:122px}
.bd{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-family:Fraunces,serif;font-size:18px;font-weight:600;line-height:1.2;margin:0}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.nota{display:inline-flex;align-items:center;gap:5px;background:var(--goldSoft);color:var(--gold);font-weight:600;font-size:12px;border-radius:8px;padding:3px 8px;margin-top:7px;align-self:flex-start}
.ds{font-size:13.5px;margin:8px 0 0;color:var(--ds)}
.hm{font-size:13px;margin:6px 0 0;color:var(--muted)}
.hm b{color:var(--ink);font-weight:600}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.pr{font-family:Fraunces,serif;font-size:20px;font-weight:600;color:var(--wt)}
.pr small{font-family:Inter;font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:-2px}
.ult{font-size:11.5px;color:var(--ult);font-weight:600}
.add{border:0;background:var(--wine);color:#fff;border-radius:12px;padding:9px 15px;font-weight:600;cursor:pointer}
.step{display:flex;align-items:center;border:1px solid var(--wine);border-radius:12px;overflow:hidden}
.step button{border:0;background:var(--soft);color:var(--wt);width:36px;height:36px;font-size:18px;font-weight:600;cursor:pointer}
.step span{min-width:30px;text-align:center;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.bar button{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--wine);color:#fff;border-radius:16px;padding:14px 18px;font-weight:600;font-size:15.5px;box-shadow:0 8px 24px rgba(110,26,47,.35);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(25,10,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:22px}}
.sheet h2{font-family:Fraunces,serif;font-size:24px;margin:0 0 12px;font-weight:600}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .n{flex:1;min-width:0;font-size:14px}
.li .n small{display:block;color:var(--muted)}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin:14px 2px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:500}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
.acts{display:grid;gap:8px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:13px;font-weight:600;cursor:pointer;font-size:15px;text-align:center;text-decoration:none;display:block}
.btn.wa{background:#1f8f4e;color:#fff}.btn.cp{background:var(--wine);color:#fff}.btn.gh{background:none;border:1px solid var(--line);color:var(--muted)}
.pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--toastBg);color:var(--toastFg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.big{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:14px}

.sm-fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:50%;border:0;background:var(--wine);color:#fff;font-size:26px;box-shadow:0 8px 22px rgba(60,10,20,.35);cursor:pointer}
.sm-tip{position:fixed;right:78px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:15;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 30px 9px 12px;font-size:13.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.15);cursor:pointer;max-width:220px}
.sm-tip b{position:absolute;right:8px;top:6px;font-weight:400;color:var(--muted);cursor:pointer;padding:0 4px}
.sm-pan{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:min(380px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
.sm-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:radial-gradient(120% 140% at 0% 0%,#8f2b44 0%,#5a1426 60%,#3a0d19 100%);color:#fbeee9}
.sm-hd .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px}
.sm-hd .tt{flex:1;line-height:1.2}.sm-hd .tt b{display:block;font-size:15px}.sm-hd .tt small{opacity:.8;font-size:12px}
.sm-hd button{border:0;background:none;color:#fbeee9;font-size:22px;cursor:pointer;padding:0 4px}
.sm-bd{flex:1;overflow:auto;padding:12px 12px 6px}
.sm-msg{max-width:88%;padding:9px 12px;border-radius:14px;margin:0 0 8px;font-size:14px;line-height:1.4}
.sm-bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.sm-me{background:var(--wine);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.sm-ops{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.sm-ops button{border:1px solid var(--wine);background:var(--card);color:var(--wt);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.sm-rec{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 8px}
.sm-rec .im{width:52px;height:84px;flex:none;border-radius:8px;background:linear-gradient(180deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.sm-rec .im img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.sm-rec .im svg{height:70px}
.sm-rec .tx{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.sm-rec .tx b{display:block;font-family:Fraunces,serif;font-size:15px;color:var(--ink);line-height:1.2}
.sm-rec .tx i{display:block;font-style:normal;color:var(--ds);margin-top:3px}
.sm-rec .rw{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.sm-rec .rw span{font-family:Fraunces,serif;font-weight:600;font-size:15px;color:var(--wt)}
.sm-rec .rw button{border:0;background:var(--wine);color:#fff;border-radius:10px;padding:6px 11px;font-weight:600;font-size:12.5px;cursor:pointer}
.sm-rec .rw button.ok{background:var(--ok)}
</style>
</head>
<body>
<div class="hero"><button class="tema" id="tema" aria-label="Mudar tema"></button><div class="in">
  <small id="hSub">Seleção especial</small>
  <h1 id="hTit">Carta de Vinhos</h1>
  <p id="hTxt">Escolha seus vinhos, monte o pedido e envie pelo WhatsApp.</p>
</div></div>
<div class="wrap">
  <div class="tools">
    <input class="search" id="q" placeholder="Buscar vinho, uva, vinícola ou prato…">
    <div class="chips" id="tipos"></div>
    <div class="chips" id="ord"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<div class="bar" id="bar" style="display:none"><button id="barBtn"></button></div>
<div id="root"></div>
<div id="sm"></div>
<script>document.write('<script src="catalogo.js?v='+Date.now()+'"><\/script>')</script>
<script>
const D = window.CATALOGO || {vinhos:[]};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const norm = s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toast(t){ const e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2200); }
const V = (D.vinhos||[]).filter(v=>Number(v.estoque)>0);
const byId = id=>V.find(v=>v.id===id);
let cart = {}; try{ cart=JSON.parse(localStorage.getItem('carta_cart')||'{}')||{}; }catch{}
Object.keys(cart).forEach(k=>{ const v=byId(k); if(!v) delete cart[k]; else cart[k]=Math.min(cart[k],Number(v.estoque)); });
let dados={}; try{ dados=JSON.parse(localStorage.getItem('carta_dados')||'{}')||{}; }catch{}
const save=()=>{ try{ localStorage.setItem('carta_cart',JSON.stringify(cart)); localStorage.setItem('carta_dados',JSON.stringify(dados)); }catch{} };
const st={tipo:'Todos',ord:'bod',q:''};

if(D.titulo) $('#hTit').textContent=D.titulo;
if(D.subtitulo) $('#hSub').textContent=D.subtitulo;
if(D.texto) $('#hTxt').textContent=D.texto;
if(D.titulo) document.title=D.titulo;
$('#foot').textContent='Preços por garrafa · sujeitos à disponibilidade'+(D.atualizado?' · atualizado em '+D.atualizado:'');

const COR={Tinto:['#5a1426','#8f2b44'],Branco:['#c9b25c','#e6d68a'],'Rosé':['#d27a8c','#efb3bf'],Espumante:['#b9a35a','#e3d394'],Destilado:['#6b6f73','#a8adb2'],Outro:['#7a6a4f','#b3a07c']};
function garrafa(tipo){ const [a,b]=COR[tipo]||COR.Tinto; const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 40 130"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs>
  <rect x="15" y="2" width="10" height="10" rx="1.5" fill="#3a2a22"/><path d="M15 12h10v22c0 6 10 10 10 22v68a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V56c0-12 10-16 10-22z" fill="url(#${id})"/>
  <rect x="7" y="70" width="26" height="30" rx="2" fill="#f6efe3" opacity=".92"/><rect x="11" y="78" width="18" height="2" fill="${a}" opacity=".6"/><rect x="13" y="84" width="14" height="1.5" fill="${a}" opacity=".4"/></svg>`; }

const TIPOS=['Todos',...['Tinto','Branco','Rosé','Espumante','Destilado','Outro'].filter(t=>V.some(v=>v.tipo===t))];
const LBL={Todos:'Todos',Tinto:'Tintos',Branco:'Brancos','Rosé':'Rosés',Espumante:'Espumantes',Destilado:'Destilados',Outro:'Outros'};
const ORD=[['bod','Por bodega'],['dest','Destaques'],['nota','Melhor avaliados'],['menor','Menor preço'],['maior','Maior preço']];
function chips(){
  $('#tipos').innerHTML=TIPOS.map(t=>`<button class="chip ${st.tipo===t?'on':''}" data-t="${t}">${LBL[t]}</button>`).join('');
  $('#ord').innerHTML=ORD.map(([k,l])=>`<button class="chip ${st.ord===k?'on':''}" data-o="${k}">${l}</button>`).join('');
}
const notaNum=v=>{ const m=String(v.nota||'').match(/(\d{2,3})/); return m?+m[1]:0; };
const bodNome=v=>{ let b=String(v.produtor||'').trim().replace(/^bodegas?\s+/i,''); if(/^vina cobos$/i.test(b)) b='Viña Cobos'; return b||'Outros'; };
function lista(){
  let l=V.slice(); if(st.tipo!=='Todos') l=l.filter(v=>v.tipo===st.tipo);
  if(st.q){ const q=norm(st.q); l=l.filter(v=>norm([v.nome,v.produtor,v.uva,v.pais,v.harmonizacao,v.descricao].join(' ')).includes(q)); }
  const cmp=(a,b)=>a.localeCompare(b,'pt',{sensitivity:'base',numeric:true});
  if(st.ord==='bod') l.sort((a,b)=>(bodNome(a)==='Outros')-(bodNome(b)==='Outros') || cmp(bodNome(a),bodNome(b)) || cmp(a.nome,b.nome));
  if(st.ord==='dest') l.sort((a,b)=>(notaNum(b)>0)-(notaNum(a)>0) || (b.foto?1:0)-(a.foto?1:0) || a.nome.localeCompare(b.nome));
  if(st.ord==='nota') l.sort((a,b)=>notaNum(b)-notaNum(a) || a.preco-b.preco);
  if(st.ord==='menor') l.sort((a,b)=>a.preco-b.preco);
  if(st.ord==='maior') l.sort((a,b)=>b.preco-a.preco);
  return l;
}
function render(){
  chips(); const l=lista();
  $('#count').textContent = l.length+' '+(l.length===1?'rótulo':'rótulos');
  const card=v=>{ const q=cart[v.id]||0;
    return `<div class="w"><div class="ph" data-ft="${v.id}">${v.foto?`<img src="${esc(v.foto)}" alt="${esc(v.nome)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=garrafa('${esc(v.tipo)}')">`:garrafa(v.tipo)}</div>
    <div class="bd"><h3 class="nm">${esc(v.nome)}</h3><div class="meta">${esc([v.produtor,v.uva,v.pais].filter(Boolean).join(' · '))}</div>
    ${v.nota?`<span class="nota">★ ${esc(v.nota)}</span>`:''}
    ${v.descricao?`<p class="ds">${esc(v.descricao)}</p>`:''}
    ${v.harmonizacao?`<p class="hm">🍽 <b>Combina com:</b> ${esc(v.harmonizacao)}</p>`:''}
    <div class="ft"><div class="pr">${brl(v.preco)}<small>${Number(v.estoque)<=2?`<span class="ult">últimas ${v.estoque} un.</span>`:'por garrafa'}</small></div>
    ${q?`<div class="step"><button data-m="${v.id}">−</button><span>${q}</span><button data-p="${v.id}">+</button></div>`:`<button class="add" data-p="${v.id}">Adicionar</button>`}</div></div></div>`; };
  let h='';
  if(st.ord==='bod'){ let cur=null; l.forEach(v=>{ const b=bodNome(v); if(b!==cur){ cur=b; const n=l.filter(x=>bodNome(x)===b).length; h+=`<h2 class="bod">${esc(b)}<small>${n} ${n===1?'rótulo':'rótulos'}</small></h2>`; } h+=card(v); }); }
  else h=l.map(card).join('');
  $('#grid').innerHTML = h || '<div class="empty">Nenhum vinho encontrado.</div>';
  barra();
}
function totais(){ let n=0,t=0; Object.entries(cart).forEach(([id,q])=>{ const v=byId(id); if(v){ n+=q; t+=q*v.preco; } }); return {n,t}; }
function barra(){ const {n,t}=totais(); $('#bar').style.display=n?'':'none'; $('#barBtn').innerHTML=`<span>Ver pedido · ${n} garrafa${n>1?'s':''}</span><span>${brl(t)}</span>`; }
function mais(id){ const v=byId(id); const q=(cart[id]||0); if(q>=Number(v.estoque)){ toast('Só temos '+v.estoque+' em estoque'); return; } cart[id]=q+1; save(); }
function menos(id){ cart[id]=(cart[id]||0)-1; if(cart[id]<=0) delete cart[id]; save(); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t],[data-o],[data-p],[data-m],[data-ft]'); if(!t) return;
  if(t.dataset.t){ st.tipo=t.dataset.t; render(); }
  else if(t.dataset.o){ st.ord=t.dataset.o; render(); }
  else if(t.dataset.p){ mais(t.dataset.p); if(t.closest('.sheet')) pedido(); else render(); }
  else if(t.dataset.m){ menos(t.dataset.m); if(t.closest('.sheet')) pedido(); else render(); }
  else if(t.dataset.ft){ const v=byId(t.dataset.ft); if(v&&v.foto) abrir(`<img class="big" src="${esc(v.foto)}" alt="" referrerpolicy="no-referrer"><div class="acts"><button class="btn gh" data-x>Fechar</button></div>`); }
});
$('#q').addEventListener('input',e=>{ st.q=e.target.value; render(); });
$('#barBtn').addEventListener('click',()=>pedido());

function abrir(html){ $('#root').innerHTML=`<div class="sheet-bg"><div class="sheet">${html}</div></div>`; const bg=$('#root').firstChild; bg.addEventListener('click',e=>{ if(e.target===bg||e.target.closest('[data-x]')) fechar(); }); return bg; }
function fechar(){ $('#root').innerHTML=''; render(); }

function mensagem(){
  const linhas=[]; let n=0,t=0;
  Object.entries(cart).forEach(([id,q])=>{ const v=byId(id); if(!v) return; n+=q; t+=q*v.preco; linhas.push(`${q}x ${v.nome} — ${brl(q*v.preco)}`); });
  const cab=['🍷 *Pedido de vinhos*', `Nome: ${dados.nome||''}`]; if(dados.tel) cab.push(`WhatsApp: ${dados.tel}`); if(dados.obs) cab.push(`Obs: ${dados.obs.replace(/\n/g,' ')}`);
  return [...cab, '', ...linhas, '', `*Total: ${brl(t)}* (${n} garrafa${n>1?'s':''})`].join('\n');
}
function pedido(){
  const its=Object.entries(cart).map(([id,q])=>({v:byId(id),q})).filter(x=>x.v);
  if(!its.length){ fechar(); return; }
  const {n,t}=totais();
  const bg=abrir(`<h2>Seu pedido</h2>
   ${its.map(({v,q})=>`<div class="li"><div class="n">${esc(v.nome)}<small>${brl(v.preco)} cada</small></div><div class="step"><button data-m="${v.id}">−</button><span>${q}</span><button data-p="${v.id}">+</button></div></div>`).join('')}
   <div class="tot"><span>Total · ${n} garrafa${n>1?'s':''}</span><span>${brl(t)}</span></div>
   <label class="f">Seu nome *<input id="fn" value="${esc(dados.nome||'')}" autocomplete="name"></label>
   <label class="f">Seu WhatsApp<input id="ft" value="${esc(dados.tel||'')}" inputmode="tel" autocomplete="tel" placeholder="(49) 99999-9999"></label>
   <label class="f">Observação / entrega<textarea id="fo" rows="2" placeholder="Endereço, melhor horário, forma de pagamento…">${esc(dados.obs||'')}</textarea></label>
   <div class="acts"><button class="btn wa" data-wa="5542988363602">Enviar para WhatsApp Guto</button><button class="btn wa" data-wa="5542999445162">Enviar para WhatsApp João Lucas</button><button class="btn cp" id="bc">Copiar pedido</button><button class="btn gh" data-x>Continuar escolhendo</button></div>
   <div class="pre" id="pv" style="display:none"></div>`);
  const sync=()=>{ dados.nome=bg.querySelector('#fn').value.trim(); dados.tel=bg.querySelector('#ft').value.trim(); dados.obs=bg.querySelector('#fo').value.trim(); save(); };
  ['#fn','#ft','#fo'].forEach(s=>bg.querySelector(s).addEventListener('input',sync));
  const ok=()=>{ sync(); if(!dados.nome){ toast('Coloque seu nome'); bg.querySelector('#fn').focus(); return false; } return true; };
  bg.querySelector('#bc').onclick=async()=>{ if(!ok()) return; const m=mensagem(); const pv=bg.querySelector('#pv'); pv.style.display=''; pv.textContent=m;
    try{ await navigator.clipboard.writeText(m); toast('Pedido copiado ✓ Agora é só colar no WhatsApp'); }catch{ toast('Selecione o texto abaixo e copie'); } };
  bg.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{ if(!ok()) return; const m=mensagem(); const num=b.dataset.wa;
    const url='https://wa.me/'+(num?num:'')+'?text='+encodeURIComponent(m); window.location.href=url;
    const pv=bg.querySelector('#pv'); pv.style.display=''; pv.textContent=m; });
}
function temaBtn(){ const e=document.documentElement.dataset.tema==='escuro'; $('#tema').textContent=e?'☀️ Claro':'🌙 Escuro'; }
$('#tema').addEventListener('click',()=>{ const d=document.documentElement; if(d.dataset.tema==='escuro'){ delete d.dataset.tema; } else { d.dataset.tema='escuro'; } try{ localStorage.setItem('carta_tema', d.dataset.tema||'claro'); }catch(e){} temaBtn(); });
temaBtn();
render();

/* ===== Assistente de escolha (sommelier) ===== */
const SM={aberto:false,passo:0,oc:null,co:null,pr:null,vistos:[]};
const SM_OC=[['dois','💑 Jantar a dois'],['churras','🔥 Churrasco com amigos'],['presente','🎁 Presente'],['festa','🥂 Comemoração'],['dia','🍽️ Dia a dia'],['relax','🛋️ Relaxar / tomar sem comida']];
const SM_CO=[['vermelha','🥩 Carne vermelha'],['churras','🍖 Churrasco'],['massa','🍝 Massas e pizza'],['ave','🍗 Frango ou porco'],['peixe','🐟 Peixes e frutos do mar'],['queijo','🧀 Queijos e petiscos'],['asia','🍣 Comida asiática'],['doce','🍰 Sobremesa'],['nada','🍷 Sem comida']];
const SM_PR=[['a','Até R$ 90'],['b','R$ 90 a 150'],['c','Acima de R$ 150'],['x','Tanto faz']];
const SM_KW={vermelha:['picanha','bife','carne','cordeiro','costela','ossobuco','ancho','chorizo','carre','caca','nobres'],churras:['churrasco','picanha','costela','carne','hamburguer','linguica','defumad','calabresa','grelhad','barbecue'],massa:['massa','pizza','lasanha','ragu','molho','risoto','italiana','sugo'],ave:['frango','porco','suin','lombo','pato','ave'],peixe:['peixe','frutos do mar','salmao','atum','sushi','ceviche','bacalhau','camarao'],queijo:['queijo','frios','tabua','petisco','embutido','aperitivo'],asia:['asiatic','tailandes','indiana','sushi','oriental'],doce:['sobremesa','chocolate','bolo','panetone','fruta']};
function smLbl(arr,k){ const x=arr.find(a=>a[0]===k); return x?x[1]:''; }
function smScore(v){
  const t=norm([v.harmonizacao,v.descricao,v.nome,v.uva].join(' ')); const nt=notaNum(v); let s=0;
  const kw=SM_KW[SM.co]||[]; kw.forEach(k=>{ if(t.includes(k)) s+=3; });
  const tipo=v.tipo, leve=/pinot|rose|branco|espumante|torront|chardonnay|semill/.test(norm(v.uva+' '+tipo));
  if(['vermelha','churras'].includes(SM.co)){ if(tipo==='Tinto') s+=4; else s-=6; if(/malbec|cabernet|blend|syrah|tannat|bonarda/.test(norm(v.uva))) s+=2; }
  if(SM.co==='massa'){ if(tipo==='Tinto') s+=3; if(/bonarda|blend|malbec|sangiovese/.test(norm(v.uva))) s+=1; }
  if(SM.co==='ave'){ if(/pinot|chardonnay|rose|cabernet franc|blend/.test(norm(v.uva+' '+tipo))) s+=2; }
  if(SM.co==='peixe'){ if(leve) s+=5; else s-=4; }
  if(SM.co==='asia'){ if(/torront|laranja|rose|espumante|pinot|riesling|semill/.test(norm(v.uva+' '+tipo))) s+=5; else if(tipo==='Tinto') s-=2; }
  if(SM.co==='doce'){ if(/sweet|doce|adocicad|suave/.test(t)) s+=8; else if(tipo==='Espumante') s+=3; else s-=2; }
  if(SM.co==='queijo'){ s+=1; }
  if(SM.co==='nada'){ if(/macio|frutad|facil|aveludad|leve/.test(t)) s+=3; }
  if(SM.oc==='dois'){ if(nt) s+=2; if(/elegante|complexo|delicad|floral/.test(t)) s+=2; if(v.preco>=100) s+=1; }
  if(SM.oc==='churras'){ if(tipo==='Tinto') s+=1; if(v.preco<=120) s+=2; if(/churrasco|hamburguer|picanha/.test(t)) s+=2; }
  if(SM.oc==='presente'){ if(nt) s+=3+(nt>=95?2:0); if(/icone|alta gama|premiad|topo|longev|grand cru/.test(t)) s+=3; if(v.preco>=150) s+=2; }
  if(SM.oc==='festa'){ if(tipo==='Espumante') s+=6; if(nt) s+=1; }
  if(SM.oc==='dia'){ if(v.preco<=100) s+=3; if(/dia a dia|facil|custo-beneficio|jovem|descomplicad/.test(t)) s+=3; if(v.preco>180) s-=3; }
  if(SM.oc==='relax'){ if(/macio|frutad|facil|aveludad|suave/.test(t)) s+=3; }
  if(nt) s+=nt/100; if(Number(v.estoque)>=3) s+=.2;
  return s;
}
function smFaixa(v){ const p=v.preco; return SM.pr==='a'?p<=90: SM.pr==='b'?(p>90&&p<=150): SM.pr==='c'?p>150: true; }
function smPor(v){
  const r=[]; const nt=v.nota?`★ ${v.nota}. `:'';
  if(v.harmonizacao) r.push('Combina com '+v.harmonizacao.replace(/\.$/,'').toLowerCase()+'.');
  return nt+(r[0]||v.descricao||'');
}
function smRecs(){
  let l=V.filter(smFaixa); if(l.length<3) l=V.slice();
  l=l.map(v=>({v,s:smScore(v)})).filter(x=>!SM.vistos.includes(x.v.id)).sort((a,b)=>b.s-a.s||a.v.preco-b.v.preco);
  const out=[]; const bod={};
  for(const x of l){ const b=norm(x.v.produtor); if(bod[b]&&SM.oc!=='festa'){ continue; } bod[b]=1; out.push(x.v); if(out.length===3) break; }
  if(out.length<3) for(const x of l){ if(!out.includes(x.v)) out.push(x.v); if(out.length===3) break; }
  return out;
}
function smFoto(v){ return v.foto?`<img src="${esc(v.foto)}" alt="" onerror="this.parentNode.innerHTML=garrafa('${esc(v.tipo)}')">`:garrafa(v.tipo); }
function smRender(){
  const el=$('#sm');
  if(!SM.aberto){
    let tip=''; try{ if(!sessionStorage.getItem('sm_tip')) tip='<div class="sm-tip" data-sm="abrir">Precisa de ajuda para escolher?<b data-sm="fechatip">×</b></div>'; }catch(e){}
    el.innerHTML=tip+'<button class="sm-fab" data-sm="abrir" aria-label="Ajuda para escolher o vinho">🍷</button>'; return;
  }
  let b='<div class="sm-msg sm-bot">Olá! 🍷 Eu te ajudo a escolher o vinho certo.</div>';
  const ops=(arr,acao)=>`<div class="sm-ops">${arr.map(([k,l])=>`<button data-sm="${acao}" data-v="${k}">${l}</button>`).join('')}</div>`;
  b+='<div class="sm-msg sm-bot">Para qual ocasião é o vinho?</div>';
  if(SM.passo===0) b+=ops(SM_OC,'oc'); else b+=`<div class="sm-msg sm-me">${smLbl(SM_OC,SM.oc)}</div>`;
  if(SM.passo>=1){ b+='<div class="sm-msg sm-bot">E o que vai ser servido?</div>'; if(SM.passo===1) b+=ops(SM_CO,'co'); else b+=`<div class="sm-msg sm-me">${smLbl(SM_CO,SM.co)}</div>`; }
  if(SM.passo>=2){ b+='<div class="sm-msg sm-bot">Quanto quer investir por garrafa?</div>'; if(SM.passo===2) b+=ops(SM_PR,'pr'); else b+=`<div class="sm-msg sm-me">${smLbl(SM_PR,SM.pr)}</div>`; }
  if(SM.passo>=3){
    const r=smRecs(); SM.ultimos=r.map(v=>v.id);
    b+= r.length? '<div class="sm-msg sm-bot">Minhas sugestões para você:</div>' : '<div class="sm-msg sm-bot">Não encontrei mais opções com esse perfil. Que tal recomeçar?</div>';
    b+=r.map(v=>{ const q=cart[v.id]||0; return `<div class="sm-rec"><div class="im">${smFoto(v)}</div><div class="tx"><b>${esc(v.nome)}</b>${esc([v.produtor,v.uva].filter(Boolean).join(' · '))}<i>${esc(smPor(v))}</i><div class="rw"><span>${brl(v.preco)}</span><button data-sm="add" data-v="${v.id}" class="${q?'ok':''}">${q?`✓ No pedido (${q})`:'Adicionar'}</button></div></div></div>`; }).join('');
    b+=`<div class="sm-ops">${r.length?'<button data-sm="mais">🔄 Outras opções</button>':''}<button data-sm="reset">↺ Recomeçar</button>${Object.keys(cart).length?'<button data-sm="pedido">🛒 Ver pedido</button>':''}</div>`;
  }
  el.innerHTML=`<div class="sm-pan"><div class="sm-hd"><div class="av">🍷</div><div class="tt"><b>Sommelier</b><small>Te ajudo a escolher</small></div><button data-sm="fechar" aria-label="Fechar">×</button></div><div class="sm-bd" id="smbd">${b}</div></div>`;
  const bd=$('#smbd'); bd.scrollTop=bd.scrollHeight;
}
$('#sm').addEventListener('click',e=>{
  const t=e.target.closest('[data-sm]'); if(!t) return; e.stopPropagation();
  const a=t.dataset.sm, v=t.dataset.v;
  if(a==='fechatip'){ try{ sessionStorage.setItem('sm_tip','1'); }catch(_){} smRender(); return; }
  if(a==='abrir'){ SM.aberto=true; try{ sessionStorage.setItem('sm_tip','1'); }catch(_){} }
  else if(a==='fechar'){ SM.aberto=false; }
  else if(a==='oc'){ SM.oc=v; SM.passo=1; }
  else if(a==='co'){ SM.co=v; SM.passo=2; }
  else if(a==='pr'){ SM.pr=v; SM.passo=3; SM.vistos=[]; }
  else if(a==='mais'){ SM.vistos=SM.vistos.concat(SM.ultimos||[]); }
  else if(a==='reset'){ SM.passo=0; SM.oc=SM.co=SM.pr=null; SM.vistos=[]; }
  else if(a==='add'){ mais(v); render(); toast('Adicionado ao pedido ✓'); }
  else if(a==='pedido'){ SM.aberto=false; smRender(); pedido(); return; }
  smRender();
});
smRender();
</script>
